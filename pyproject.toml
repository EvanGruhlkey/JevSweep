[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jevsweep"
version = "0.2.0"
description = "Jev-based tool-output pruning for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Evan Gruhlkey" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = []
keywords = [
  "coding-agents",
  "context-engineering",
  "developer-tools",
  "evaluation",
  "llm",
  "mcp",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/EvanGruhlkey/JevSweep"
Documentation = "https://github.com/EvanGruhlkey/JevSweep#readme"
Issues = "https://github.com/EvanGruhlkey/JevSweep/issues"
Repository = "https://github.com/EvanGruhlkey/JevSweep.git"

[project.scripts]
jevsweep = "jevsweep.cli:main"
jevsweep-claude-hook = "jevsweep.integrations:claude_main"
jevsweep-run = "jevsweep.integrations:codex_main"
jevsweep-install = "jevsweep.install:main"

[tool.hatch.build]
# The paired benchmark harness is development-only. Expose it to editable
# installs without shipping it in the production wheel.
dev-mode-dirs = ["src", "."]

[tool.hatch.build.targets.wheel]
packages = ["src/jevsweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["jevsweep"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jevsweep"]
